<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>बस सफर</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --green:#1ed760; --green-dim:rgba(30,215,96,.18);
      --glass:rgba(8,8,18,.65); --border:rgba(255,255,255,.10);
      --text:#f1f5f9; --muted:rgba(241,245,249,.55);
    }
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Inter',sans-serif;}

    /* VIDEO */
    #bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.68) saturate(1.2);}

    /* OVERLAYS */
    .ov-top{position:fixed;top:0;left:0;right:0;height:24%;background:linear-gradient(to bottom,rgba(0,0,0,.78),transparent);z-index:1;pointer-events:none;}
    .ov-bot{position:fixed;bottom:0;left:0;right:0;height:42%;background:linear-gradient(to top,rgba(0,0,0,.92),transparent);z-index:1;pointer-events:none;}

    /* GLOWS */
    .glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.16;z-index:1;pointer-events:none;}
    .g1{width:520px;height:520px;background:radial-gradient(circle,#f97316,transparent 70%);bottom:-80px;left:-60px;animation:gl 9s ease-in-out infinite alternate;}
    .g2{width:400px;height:400px;background:radial-gradient(circle,#818cf8,transparent 70%);top:-60px;right:-40px;animation:gl 11s ease-in-out infinite alternate-reverse;}
    @keyframes gl{from{transform:translate(0,0) scale(1);}to{transform:translate(28px,18px) scale(1.09);}}

    /* HUD */
    #hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
    #hud>*{pointer-events:auto;}

    /* CLOCK */
    #clk{position:absolute;top:22px;left:28px;}
    #clk-time{font-size:15px;font-weight:500;color:var(--text);text-shadow:0 1px 8px rgba(0,0,0,.7);}
    #clk-date{font-size:11px;color:var(--muted);margin-top:2px;}

    /* ONLINE */
    #badge{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:5px 14px;backdrop-filter:blur(14px);}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pu 1.8s ease-out infinite;}
    @keyframes pu{0%{box-shadow:0 0 0 0 rgba(30,215,96,.6);}70%{box-shadow:0 0 0 7px rgba(30,215,96,0);}100%{box-shadow:0 0 0 0 rgba(30,215,96,0);}}
    #badge span{font-size:12px;color:var(--text);font-weight:500;}

    /* TOP RIGHT */
    #tr{position:absolute;top:18px;right:24px;}
    .pill{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:5px 13px;text-decoration:none;color:var(--text);font-size:11px;font-weight:500;backdrop-filter:blur(14px);transition:background .2s,transform .18s;}
    .pill:hover{background:rgba(255,255,255,.14);transform:translateY(-1px);}

    /* TITLE */
    #title{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;animation:ti 1.1s cubic-bezier(.22,.61,.36,1) both;}
    @keyframes ti{from{opacity:0;transform:translate(-50%,-44%) scale(.92);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
    #title h1{font-family:'Tiro Devanagari Hindi',serif;font-size:clamp(68px,11vw,152px);font-weight:400;color:#fff;line-height:1.05;text-shadow:0 2px 40px rgba(0,0,0,.9),0 0 80px rgba(249,115,22,.28);}

    /* ══ MUSIC PLAYER ══ */
    #player{
      position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
      width:360px;
      background:rgba(10,10,20,.82);
      border:1px solid rgba(255,255,255,.12);
      border-radius:20px;
      backdrop-filter:blur(28px);
      -webkit-backdrop-filter:blur(28px);
      padding:14px 16px 16px;
      box-shadow:0 20px 60px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.05);
      transition:opacity .4s,transform .4s cubic-bezier(.22,.61,.36,1);
    }
    #player.hidden{opacity:0;transform:translateX(-50%) translateY(30px) scaleY(.88);pointer-events:none;}

    /* Track info row */
    #track-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
    #art{
      width:52px;height:52px;border-radius:10px;object-fit:cover;
      background:#1a1a2e;flex-shrink:0;
      box-shadow:0 4px 16px rgba(0,0,0,.5);
      transition:opacity .3s;
    }
    #track-info{flex:1;min-width:0;}
    #track-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #track-artist{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #track-album{font-size:10px;color:rgba(241,245,249,.35);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    /* No-preview badge */
    #no-preview{display:none;font-size:10px;color:rgba(249,115,22,.9);background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.25);border-radius:6px;padding:2px 8px;margin-top:4px;width:fit-content;}

    /* Progress */
    #progress-wrap{margin-bottom:8px;}
    #progress-bg{width:100%;height:3px;background:rgba(255,255,255,.12);border-radius:999px;cursor:pointer;position:relative;}
    #progress-bar{height:100%;background:var(--green);border-radius:999px;width:0%;transition:width .5s linear;pointer-events:none;}
    #time-row{display:flex;justify-content:space-between;margin-top:4px;}
    #time-row span{font-size:10px;color:var(--muted);}

    /* Controls */
    #controls{display:flex;align-items:center;justify-content:center;gap:20px;}
    .ctrl-btn{background:none;border:none;cursor:pointer;color:var(--muted);transition:color .18s,transform .18s;padding:4px;display:flex;align-items:center;justify-content:center;}
    .ctrl-btn:hover{color:var(--text);transform:scale(1.12);}
    #play-btn{
      width:42px;height:42px;border-radius:50%;
      background:var(--green);border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .2s,transform .18s;
      box-shadow:0 4px 16px rgba(30,215,96,.35);
    }
    #play-btn:hover{background:#1fdf65;transform:scale(1.07);}
    #play-btn svg{color:#000;}

    /* Toggle button above player */
    #toggle-wrap{
      position:absolute;bottom:calc(24px + /* player height approx */ 172px + 10px);
      left:50%;transform:translateX(-50%);
    }
    #toggle-btn{
      display:flex;align-items:center;gap:6px;
      background:var(--green-dim);border:1px solid rgba(30,215,96,.38);
      border-radius:999px;padding:7px 18px;
      color:var(--green);font-size:11px;font-weight:700;letter-spacing:.07em;
      cursor:pointer;backdrop-filter:blur(12px);transition:background .2s,transform .18s;
      white-space:nowrap;
    }
    #toggle-btn:hover{background:rgba(30,215,96,.30);transform:translateY(-1px);}

    /* LOADING state */
    #loading{
      position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
      display:none;align-items:center;gap:8px;
      background:var(--glass);border:1px solid var(--border);
      border-radius:999px;padding:8px 18px;backdrop-filter:blur(14px);
      color:var(--text);font-size:12px;
    }
    .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* GRAIN */
    #grain{position:fixed;inset:0;z-index:2;opacity:.03;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;animation:gr .12s steps(1) infinite;}
    @keyframes gr{0%{transform:translate(0,0);}33%{transform:translate(-2px,2px);}66%{transform:translate(2px,-2px);}100%{transform:translate(-1px,1px);}}
  </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline>
  <source src="busdriver.mp4" type="video/mp4"/>
</video>
<div class="ov-top"></div>
<div class="ov-bot"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div id="grain"></div>

<!-- Hidden audio element — plays 30-sec Spotify previews -->
<audio id="audio"></audio>

<div id="hud">

  <!-- Clock -->
  <div id="clk">
    <div id="clk-time">12:00 PM</div>
    <div id="clk-date">Monday, 10 Aug 2026</div>
  </div>

  <!-- Online badge -->
  <div id="badge">
    <div class="dot"></div>
    <span id="badge-count">41 online</span>
  </div>

  <!-- Spotify open link -->
  <div id="tr">
    <a href="https://open.spotify.com/playlist/3jU4pDLZuYICElkyyRJwQi" target="_blank" rel="noopener" class="pill">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#1ed760"><path d="M12 0C5.374 0 0 5.373 0 12c0 6.628 5.374 12 12 12 6.628 0 12-5.372 12-12 0-6.627-5.372-12-12-12zm5.51 17.34c-.214.33-.672.44-1.003.215-2.75-1.682-6.21-2.062-10.285-1.13-.394.09-.788-.156-.878-.551-.09-.394.156-.788.551-.878 4.459-1.017 8.283-.58 11.38 1.307.33.215.44.673.235 1.037zm1.47-3.27c-.27.413-.836.544-1.25.275-3.144-1.933-7.935-2.493-11.653-1.364-.473.142-.97-.13-1.112-.603-.141-.473.131-.97.604-1.112 4.248-1.29 9.518-.665 13.136 1.553.413.27.544.836.275 1.25zm.127-3.406c-3.769-2.237-9.986-2.443-13.586-1.352-.576.175-1.185-.15-1.36-.727-.174-.577.151-1.185.727-1.36 4.135-1.257 11.003-1.015 15.348 1.566.52.31.69.98.382 1.5-.31.52-.98.69-1.511.373z"/></svg>
      Spotify ↗
    </a>
  </div>

  <!-- Hindi title -->
  <div id="title"><h1>बस सफर</h1></div>

  <!-- Loading spinner (shown while fetching tracks) -->
  <div id="loading">
    <div class="spin"></div>
    <span>Tracks लोड हो रहे हैं…</span>
  </div>

  <!-- Toggle button -->
  <div id="toggle-wrap">
    <button id="toggle-btn" onclick="togglePlayer()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#1ed760"><path d="M12 0C5.374 0 0 5.373 0 12c0 6.628 5.374 12 12 12 6.628 0 12-5.372 12-12 0-6.627-5.372-12-12-12zm5.51 17.34c-.214.33-.672.44-1.003.215-2.75-1.682-6.21-2.062-10.285-1.13-.394.09-.788-.156-.878-.551-.09-.394.156-.788.551-.878 4.459-1.017 8.283-.58 11.38 1.307.33.215.44.673.235 1.037zm1.47-3.27c-.27.413-.836.544-1.25.275-3.144-1.933-7.935-2.493-11.653-1.364-.473.142-.97-.13-1.112-.603-.141-.473.131-.97.604-1.112 4.248-1.29 9.518-.665 13.136 1.553.413.27.544.836.275 1.25zm.127-3.406c-3.769-2.237-9.986-2.443-13.586-1.352-.576.175-1.185-.15-1.36-.727-.174-.577.151-1.185.727-1.36 4.135-1.257 11.003-1.015 15.348 1.566.52.31.69.98.382 1.5-.31.52-.98.69-1.511.373z"/></svg>
      <span id="toggle-label">🎵 सुनें</span>
    </button>
  </div>

  <!-- Music Player Card -->
  <div id="player" class="hidden">
    <div id="track-row">
      <img id="art" src="" alt="Album Art"/>
      <div id="track-info">
        <div id="track-name">—</div>
        <div id="track-artist">—</div>
        <div id="track-album"></div>
        <div id="no-preview">⚠ Preview उपलब्ध नहीं</div>
      </div>
    </div>
    <div id="progress-wrap">
      <div id="progress-bg" onclick="seek(event)">
        <div id="progress-bar"></div>
      </div>
      <div id="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-tot">0:30</span>
      </div>
    </div>
    <div id="controls">
      <button class="ctrl-btn" onclick="prevTrack()" title="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="play-btn" onclick="togglePlay()" title="Play/Pause">
        <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="nextTrack()" title="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 3.9V8.1L8.5 12zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
  </div>

</div><!-- /hud -->

<script>
/* ── Clock ── */
function tick(){
  const n=new Date(), h=n.getHours(), m=n.getMinutes();
  const ampm=h>=12?'PM':'AM', hh=((h%12)||12).toString().padStart(2,'0'), mm=m.toString().padStart(2,'0');
  document.getElementById('clk-time').textContent=hh+':'+mm+' '+ampm;
  const D=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clk-date').textContent=D[n.getDay()]+', '+n.getDate()+' '+M[n.getMonth()]+' '+n.getFullYear();
}
tick(); setInterval(tick,1000);

/* ── Online count ── */
let bc=38+Math.floor(Math.random()*12);
setInterval(()=>{
  bc+=(Math.random()>.5?1:-1)*Math.floor(Math.random()*3);
  bc=Math.max(20,Math.min(bc,85));
  document.getElementById('badge-count').textContent=bc+' online';
},3200);

/* ── Music Player ── */
const audio    = document.getElementById('audio');
const artEl    = document.getElementById('art');
const nameEl   = document.getElementById('track-name');
const artistEl = document.getElementById('track-artist');
const albumEl  = document.getElementById('track-album');
const noPrev   = document.getElementById('no-preview');
const progBar  = document.getElementById('progress-bar');
const timeCur  = document.getElementById('time-cur');
const timeTot  = document.getElementById('time-tot');
const playIcon = document.getElementById('play-icon');
const playerEl = document.getElementById('player');
const loadEl   = document.getElementById('loading');
const toggleBtn= document.getElementById('toggle-btn');
const toggleLbl= document.getElementById('toggle-label');

let tracks=[], idx=0, playerOpen=false, tracksLoaded=false;

/* Fetch tracks from our Python proxy */
async function loadTracks(){
  loadEl.style.display='flex';
  try{
    const r=await fetch('/api/tracks');
    const data=await r.json();
    if(data.error){ throw new Error(data.error); }
    tracks=data;
    tracksLoaded=true;
    loadEl.style.display='none';
    if(tracks.length>0){ loadTrack(0,false); }
    else{ nameEl.textContent='Playlist खाली है या preview नहीं मिला'; }
  }catch(e){
    loadEl.style.display='none';
    nameEl.textContent='Server से connect करें (spotify_server.py)';
    artistEl.textContent=e.message||'';
  }
}

function fmt(s){
  s=Math.floor(s||0);
  return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');
}

function loadTrack(i, autoplay){
  idx=i;
  const t=tracks[idx];
  nameEl.textContent   = t.name;
  artistEl.textContent = t.artist;
  albumEl.textContent  = t.album;
  artEl.src            = t.image||'';
  progBar.style.width  = '0%';
  timeCur.textContent  = '0:00';

  if(t.preview_url){
    noPrev.style.display='none';
    audio.src=t.preview_url;
    timeTot.textContent='0:30';
    if(autoplay){ audio.play().catch(()=>{}); }
    setPlayIcon(autoplay);
  }else{
    noPrev.style.display='block';
    audio.src='';
    timeTot.textContent='0:30';
    setPlayIcon(false);
  }
}

function setPlayIcon(playing){
  playIcon.innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'  /* pause */
    : '<path d="M8 5v14l11-7z"/>';                     /* play  */
}

function togglePlay(){
  if(!tracksLoaded) return;
  if(!tracks[idx]?.preview_url){ nextTrack(); return; }
  if(audio.paused){ audio.play(); setPlayIcon(true); }
  else            { audio.pause(); setPlayIcon(false); }
}

function nextTrack(){ if(!tracks.length) return; loadTrack((idx+1)%tracks.length,true); }
function prevTrack(){ if(!tracks.length) return; loadTrack((idx-1+tracks.length)%tracks.length,true); }

/* Auto-advance when preview ends */
audio.addEventListener('ended',()=>{ nextTrack(); });

/* Progress bar */
audio.addEventListener('timeupdate',()=>{
  const pct=(audio.duration?audio.currentTime/audio.duration:0)*100;
  progBar.style.width=pct+'%';
  timeCur.textContent=fmt(audio.currentTime);
});

function seek(e){
  if(!audio.duration) return;
  const r=e.currentTarget.getBoundingClientRect();
  const pct=(e.clientX-r.left)/r.width;
  audio.currentTime=pct*audio.duration;
}

/* Toggle player visibility */
function togglePlayer(){
  playerOpen=!playerOpen;
  if(playerOpen){
    playerEl.classList.remove('hidden');
    toggleLbl.textContent='✕ बंद करें';
    if(!tracksLoaded){ loadTracks(); }
  }else{
    playerEl.classList.add('hidden');
    toggleLbl.textContent='🎵 सुनें';
    audio.pause();
    setPlayIcon(false);
  }
}
</script>
</body>
</html>
