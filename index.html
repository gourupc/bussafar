<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>बस सफर</title>
  <meta name="description" content="बस सफर — एक सफर जो दिल को छू जाए। Music, motion & memories." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; touch-action: manipulation; }
    :root {
      --accent: #1ed760;
      --glass-bg: rgba(10, 10, 20, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --muted: rgba(241, 245, 249, 0.55);
    }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Inter',sans-serif; }

    /* CLUB VIBE NEON THEME */
    body.club-theme {
      --accent: #d946ef;
      --glass-bg: rgba(15, 5, 25, 0.80);
    }
    body.club-theme .glow-orange {
      background: radial-gradient(circle, #d946ef 0%, transparent 70%) !important;
    }
    body.club-theme .glow-indigo {
      background: radial-gradient(circle, #06b6d4 0%, transparent 70%) !important;
    }
    body.club-theme .mode-btn.active {
      background: var(--accent);
      color: #000 !important;
      box-shadow: 0 2px 10px rgba(217,70,239,0.35);
    }

    /* OPEN MIC AMBER/GOLD THEME */
    body.mic-theme {
      --accent: #f59e0b;
      --glass-bg: rgba(20, 15, 10, 0.70);
    }
    body.mic-theme .glow-orange {
      background: radial-gradient(circle, #f59e0b 0%, transparent 70%) !important;
    }
    body.mic-theme .glow-indigo {
      background: radial-gradient(circle, #f43f5e 0%, transparent 70%) !important;
    }
    body.mic-theme .mode-btn.active {
      background: var(--accent);
      color: #000 !important;
      box-shadow: 0 2px 10px rgba(245,158,11,0.35);
    }

    /* VIDEO BACKGROUND */
    #bg-video {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:0;
      filter:brightness(0.70) saturate(1.15);
    }

    /* OVERLAYS */
    .overlay-top {
      position:fixed; top:0; left:0; right:0; height:24%;
      background:linear-gradient(to bottom,rgba(0,0,0,0.75) 0%,transparent 100%);
      z-index:1; pointer-events:none;
    }
    .overlay-bottom {
      position:fixed; bottom:0; left:0; right:0; height:42%;
      background:linear-gradient(to top,rgba(0,0,0,0.92) 0%,transparent 100%);
      z-index:1; pointer-events:none;
    }

    /* GLOWS */
    .glow { position:fixed; border-radius:50%; filter:blur(90px); opacity:.16; z-index:1; pointer-events:none; animation:floatGlow 9s ease-in-out infinite alternate; }
    .glow-orange { width:520px; height:520px; background:radial-gradient(circle,#f97316 0%,transparent 70%); bottom:-80px; left:-60px; }
    .glow-indigo  { width:420px; height:420px; background:radial-gradient(circle,#818cf8 0%,transparent 70%); top:-60px; right:-40px; animation-duration:11s; animation-direction:alternate-reverse; }
    @keyframes floatGlow { from{transform:translate(0,0) scale(1);} to{transform:translate(30px,20px) scale(1.08);} }

    /* HUD */
    #hud { position:fixed; inset:0; z-index:10; pointer-events:none; }
    #hud > * { pointer-events:auto; }

    /* MODE SWITCHER (SEGMENTED CONTROL) */
    #mode-switcher {
      position: absolute;
      top: 22px;
      right: 28px;
      display: flex;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 3px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .mode-btn {
      background: none;
      border: none;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .mode-btn:hover {
      color: #fff;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #000 !important;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(30,215,96,0.35);
    }

    /* ADMIN SHORTCUT BUTTON */
    #admin-toggle-btn {
      position: absolute;
      top: 22px;
      right: 350px; /* Positioned left of switcher */
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 5px 12px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.3s;
      z-index: 100;
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: none !important; /* Hidden by default */
    }
    #admin-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    /* ADMIN MODAL */
    #admin-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    #admin-card {
      background: rgba(15, 15, 25, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 20px; width: 300px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      color: #fff;
    }
    .modal-title { font-size: 13px; font-weight: 600; text-align: center; }
    .admin-input {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 8px 12px; color: #fff;
      font-size: 11px; outline: none; width: 100%;
    }
    .admin-input:focus { border-color: var(--accent); }
    .modal-btn-row { display: flex; gap: 10px; margin-top: 6px; }
    .modal-btn {
      flex: 1; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 600;
      cursor: pointer; border: none; outline: none; transition: all 0.2s;
    }
    #modal-submit { background: var(--accent); color: #000; }
    #modal-submit:hover { background: #1fdf65; transform: scale(1.02); }
    #modal-cancel { background: rgba(255,255,255,0.08); color: var(--muted); border: 1px solid rgba(255,255,255,0.12); }
    #modal-cancel:hover { background: rgba(255,255,255,0.15); color: #fff; }

    /* Clock */
    #clock-wrap { position:absolute; top:22px; left:28px; display:flex; flex-direction:column; gap:2px; }
    #clock { font-size:15px; font-weight:500; color:var(--text); letter-spacing:.04em; text-shadow:0 1px 8px rgba(0,0,0,.7); }
    #date-display { font-size:11px; color:var(--muted); letter-spacing:.05em; text-shadow:0 1px 6px rgba(0,0,0,.6); }

    /* Online badge */
    #online-badge {
      position:absolute; top:22px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center; gap:7px;
      background:var(--glass-bg); border:1px solid var(--glass-border);
      border-radius:999px; padding:5px 14px;
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    #online-badge:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .pulse-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; animation:pulseDot 1.8s ease-out infinite; }
    @keyframes pulseDot { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.6);} 70%{box-shadow:0 0 0 7px rgba(34,197,94,0);} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0);} }
    #online-count { font-size:12px; color:var(--text); font-weight:500; letter-spacing:.04em; }

    /* TITLE */
    #title-wrap {
      position:absolute; top:42%; left:50%; transform:translate(-50%,-50%);
      text-align:center; pointer-events:none;
      width: 100%;
      animation:titleIn 1.1s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes titleIn { from{opacity:0;transform:translate(-50%,-44%) scale(.92);} to{opacity:1;transform:translate(-50%,-50%) scale(1);} }
    #main-title {
      font-family:'Tiro Devanagari Hindi',serif;
      font-size:clamp(60px,12vw,160px); font-weight:400; color:#fff; line-height:1.05;
      text-shadow:0 2px 40px rgba(0,0,0,.9),0 0 80px rgba(249,115,22,.25);
      letter-spacing:-.01em;
    }

    /* ══ PREMIUM MUSIC PLAYER CARD ══ */
    #player-card {
      position:absolute; bottom:32px; left:50%; transform:translateX(-50%);
      width:250px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      padding: 12px 14px 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: background 0.3s;
    }

    #track-info-row { display:flex; align-items:center; justify-content:center; text-align:center; }
    #track-details { flex:1; min-width:0; }
    #t-title { font-size:11px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #t-artist { font-size:9px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* Progress seeker */
    #prog-wrap { width: 100%; }
    #prog-bg { width:100%; height:3px; background:rgba(255,255,255,.12); border-radius:999px; cursor:pointer; position:relative; }
    #prog-bar { height:100%; background:var(--accent); border-radius:999px; width:0%; transition:width 0.1s linear; pointer-events:none; }
    #time-row { display:flex; justify-content:space-between; margin-top:3px; }
    #time-row span { font-size:9px; color:var(--muted); }

    /* Control buttons */
    #controls { display:flex; align-items:center; justify-content:center; gap:16px; }
    .btn { background:none; border:none; cursor:pointer; color:var(--muted); transition:color .18s,transform .18s; padding:3px; display:flex; align-items:center; justify-content:center; }
    .btn:hover { color:var(--text); transform:scale(1.12); }
    #play-btn {
      width:34px; height:34px; border-radius:50%;
      background:var(--accent); border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .2s,transform .18s;
      box-shadow:0 3px 12px rgba(30,215,96,.30);
      color: #000;
    }
    #play-btn:hover { background:#1fdf65; transform:scale(1.07); }
    #play-btn svg { fill: #000; color: #000; }

    .active-shuffle {
      color: var(--accent) !important;
      filter: drop-shadow(0 0 6px rgba(30, 215, 96, 0.6));
    }

    /* SLOWED & REVERB TOGGLE */
    #fx-row { display:flex; justify-content:center; }
    .pill-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 500;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.22s ease;
      display: flex;
      align-items: center;
      gap: 4px;
      outline: none;
    }
    .pill-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .pill-btn.active {
      background: rgba(168, 85, 247, 0.25);
      border-color: rgba(168, 85, 247, 0.8);
      color: #e9d5ff;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.4);
    }

    /* HIDDEN YOUTUBE PLAYER CONTAINER */
    #yt-player-container { position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; opacity: 0; pointer-events: none; }

    /* GRAIN */
    #grain {
      position:fixed; inset:0; z-index:2; opacity:.03; pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:200px; animation:grain .15s steps(1) infinite;
    }
    @keyframes grain { 0%{transform:translate(0,0);} 25%{transform:translate(-3px,2px);} 50%{transform:translate(2px,-3px);} 75%{transform:translate(-1px,3px);} 100%{transform:translate(3px,-1px);} }

    @keyframes neonFlash {
      0%, 100% { border-color: rgba(255,255,255,0.12); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
      50% { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
    }

    /* MOBILE OPTIMIZATIONS */
    @media (max-width: 600px) {
      #main-title {
        font-size: clamp(40px, 10vw, 72px) !important;
      }
      #clock-wrap {
        top: 16px !important;
        left: 16px !important;
      }
      #clock {
        font-size: 12px !important;
      }
      #date-display {
        font-size: 9px !important;
      }
      #online-badge {
        top: 16px !important;
        padding: 4px 10px !important;
      }
      #online-count {
        font-size: 10px !important;
      }
      #mode-switcher {
        top: 16px !important;
        right: 16px !important;
      }
      .mode-btn {
        padding: 5px 8px !important;
        font-size: 10px !important;
      }
      .btn-text {
        display: none !important;
      }
      #admin-toggle-btn {
        top: 16px !important;
        right: 140px !important;
        padding: 4px 10px !important;
        font-size: 9px !important;
      }
      #player-card {
        bottom: 24px !important;
        width: 220px !important;
        padding: 10px 12px 10px !important;
      }
      #t-title {
        font-size: 10px !important;
      }
      #t-artist {
        font-size: 8px !important;
      }
      #controls {
        gap: 12px !important;
      }
      #play-btn {
        width: 30px !important;
        height: 30px !important;
      }
      #play-btn svg {
        width: 14px !important;
        height: 14px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video id="bg-video" loop muted playsinline>
    <source src="busdriver.mp4" type="video/mp4" />
  </video>

  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>
  <div class="glow glow-orange"></div>
  <div class="glow glow-indigo"></div>
  <div id="grain"></div>

  <!-- Hidden YouTube Player Iframe -->
  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <div id="hud">

    <!-- Segmented Mode Switcher (Top Right) -->
    <div id="mode-switcher">
      <button class="mode-btn active" id="btn-bus" onclick="setMode('bus')"><span>🚌</span> <span class="btn-text">Bus Safar</span></button>
      <button class="mode-btn" id="btn-club" onclick="setMode('club')"><span>🪩</span> <span class="btn-text">Club Vibe</span></button>
      <button class="mode-btn" id="btn-mic" onclick="setMode('mic')"><span>🎤</span> <span class="btn-text">Open Mic</span></button>
    </div>

    <!-- Admin Shortcut (Top Right) -->
    <div id="admin-toggle-btn" onclick="openAdminModal()">
      <span>➕</span>
      <span>Add Song</span>
    </div>

    <!-- Clock -->
    <div id="clock-wrap" onclick="handleClockTap()" style="cursor:pointer;">
      <div id="clock">12:00 PM</div>
      <div id="date-display">Monday, 10 Aug 2026</div>
    </div>

    <!-- Online badge -->
    <div id="online-badge" onclick="window.open('https://www.instagram.com/GOURU_', '_blank')">
      <div class="pulse-dot"></div>
      <span id="online-count">41 online</span>
    </div>

    <!-- Hindi Title -->
    <div id="title-wrap">
      <h1 id="main-title">बस सफर</h1>
    </div>

    <!-- ══ PREMIUM MUSIC PLAYER CARD ══ -->
    <div id="player-card">
      <div id="track-info-row">
        <div id="track-details">
          <div id="t-title">Loading...</div>
          <div id="t-artist">—</div>
        </div>
      </div>

      <div id="prog-wrap">
        <div id="prog-bg" onclick="seek(event)">
          <div id="prog-bar"></div>
        </div>
        <div id="time-row">
          <span id="time-cur">0:00</span>
          <span id="time-tot">0:00</span>
        </div>
      </div>

      <div id="controls">
        <button class="btn" onclick="prevTrack()" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button id="play-btn" onclick="togglePlay()" title="Play/Pause">
          <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn" onclick="nextTrack()" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 3.9V8.1L8.5 12zM16 6h2v12h-2z"/></svg>
        </button>
      </div>
      <div id="fx-row">
        <button id="slowed-btn" class="pill-btn" onclick="toggleSlowed()">🌙 Slowed & Reverb</button>
      </div>
    </div>

  </div><!-- /hud -->

  <!-- Admin Modal (Link Only) -->
  <div id="admin-modal">
    <div id="admin-card">
      <div class="modal-title" id="modal-title-text">Add to Bus Safar</div>
      
      <input type="text" id="adm-yt-url" class="admin-input" placeholder="Paste YouTube Link here..." />
      
      <div class="modal-btn-row">
        <button id="modal-cancel" class="modal-btn" onclick="closeAdminModal()">Cancel</button>
        <button id="modal-submit" class="modal-btn" onclick="submitNewTrack()">Add Song</button>
      </div>
    </div>
  </div>

  <!-- Load YouTube Iframe Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    /* ── Clock ── */
    function updateClock() {
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hh = ((h%12)||12).toString().padStart(2,'0');
      const mm = m.toString().padStart(2,'0');
      document.getElementById('clock').textContent = hh+':'+mm+' '+ampm;
      const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('date-display').textContent =
        days[now.getDay()]+', '+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear();
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ── Online count ── */
    let baseCount = 38 + Math.floor(Math.random()*12);
    function updateCount() {
      baseCount += (Math.random()>.5?1:-1) * Math.floor(Math.random()*3);
      baseCount = Math.max(20, Math.min(baseCount, 85));
      document.getElementById('online-count').textContent = baseCount+' online';
    }
    setInterval(updateCount, 3200);

    /* ── Tracklist Data ── */
    let tracks = [];
    let currentTrackIdx = 0;
    let ytPlayer = null;
    let progressInterval = null;
    let isSlowed = false;
    let isShuffle = true;
    let playlistQueue = [];
    let queueIndex = 0;
    let currentMode = 'bus'; // 'bus', 'club', 'mic'

    function buildShuffleQueue(firstIndex = 0) {
      if (tracks.length === 0) return;
      let indices = Array.from({length: tracks.length}, (_, i) => i);
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      if (firstIndex !== undefined && firstIndex >= 0) {
        const found = indices.indexOf(firstIndex);
        if (found !== -1) {
          indices.splice(found, 1);
          indices.unshift(firstIndex);
        }
      }
      playlistQueue = indices;
      queueIndex = 0;
    }

    function setMode(mode) {
      currentMode = mode;
      
      // Update active switcher buttons styling
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + mode).classList.add('active');

      // Reset slowed mode when changing themes
      isSlowed = false;
      const slowedBtn = document.getElementById('slowed-btn');
      if (slowedBtn) {
        slowedBtn.classList.remove('active');
        slowedBtn.innerHTML = '🌙 Slowed & Reverb';
      }
      applyPlaybackRate();

      // Show/Hide slowed button container based on mode (Hide for club, Show for bus and mic)
      const fxRow = document.getElementById('fx-row');
      if (fxRow) {
        fxRow.style.display = (currentMode === 'bus') ? 'flex' : 'none';
      }

      // Update UI theme styling
      document.body.classList.remove('club-theme', 'mic-theme');
      if (currentMode === 'club') {
        document.body.classList.add('club-theme');
      } else if (currentMode === 'mic') {
        document.body.classList.add('mic-theme');
      }
      
      // Update main title (Hindi translation)
      const titles = {
        'bus': 'बस सफर',
        'club': 'क्लब वाइब',
        'mic': 'ओपन माइक'
      };
      document.getElementById('main-title').textContent = titles[currentMode];
      
      // Update background video
      const bgVideo = document.getElementById('bg-video');
      if (bgVideo) {
        const videos = {
          'bus': 'busdriver.mp4',
          'club': 'club.mp4',
          'mic': 'mic.mp4'
        };
        bgVideo.src = videos[currentMode];
        bgVideo.load();
        bgVideo.play().catch(e => console.log('Video autoplay blocked:', e));
      }
      
      // Reload corresponding playlist and start track 0
      fetchTracks();
    }

    function toggleSlowed() {
      isSlowed = !isSlowed;
      const btn = document.getElementById('slowed-btn');
      if (btn) {
        btn.classList.toggle('active', isSlowed);
        btn.innerHTML = isSlowed ? '✨ Slowed & Reverb (ON)' : '🌙 Slowed & Reverb';
      }
      applyPlaybackRate();
      if (tracks.length > 0) {
        let isPlaying = false;
        let curTime = 0;
        if (ytPlayer && ytPlayer.getPlayerState) {
          isPlaying = (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING);
          curTime = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
        }
        loadTrack(currentTrackIdx, isPlaying, curTime);
      }
    }

    function applyPlaybackRate() {
      if (ytPlayer && ytPlayer.setPlaybackRate) {
        ytPlayer.setPlaybackRate(isSlowed ? 0.95 : 1.0);
      }
    }

    /* Initialize YouTube Player API */
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '100',
        width: '100',
        playerVars: {
          'playsinline': 1,
          'controls': 0,
          'rel': 0,
          'showinfo': 0,
          'disablekb': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      ytPlayer.setVolume(80);
      if (tracks.length > 0) {
        loadTrack(currentTrackIdx, false);
      }
    }

    function onPlayerError(event) {
      console.warn('Playback error ' + event.data + ', automatically skipping to next track...');
      nextTrack();
    }

    function onPlayerStateChange(event) {
      const bgVideo = document.getElementById('bg-video');
      if (event.data === YT.PlayerState.ENDED) {
        nextTrack();
      } else if (event.data === YT.PlayerState.PLAYING) {
        updatePlayIcon(true);
        startProgressBar();
        applyPlaybackRate();
        if (bgVideo && bgVideo.paused) {
          bgVideo.play().catch(e => console.log('Video autoplay blocked:', e));
        }
      } else {
        updatePlayIcon(false);
        stopProgressBar();
        if (bgVideo && !bgVideo.paused) {
          bgVideo.pause();
        }
      }
    }

    /* Update OS Media Session (Lock Screen & Background Controls) */
    function updateMediaSession(track) {
      if ('mediaSession' in navigator) {
        let displayTitle = track.title + (isSlowed ? ' (Slowed & Reverb)' : '');
        let displayArtist = track.artist;
        if (currentMode === 'club' || currentMode === 'mic') {
          displayArtist = '';
          displayTitle = displayTitle
            .replace(/\s*-\s*Dj.*/gi, '')
            .replace(/\s*-\s*Remix.*/gi, '')
            .replace(/\s*-\s*Acoustic.*/gi, '')
            .replace(/\s*\(Remix\)/gi, '')
            .replace(/\s*\(Deephouse Mix\)/gi, '')
            .replace(/\s*\(Acoustic Cover\)/gi, '')
            .replace(/\s*\(MTV Unplugged\)/gi, '')
            .replace(/\s*\(From [^\)]+\)/gi, '')
            .replace(/\s*\(Official [^\)]+\)/gi, '')
            .replace(/\s*\[[^\]]+\]/gi, '')
            .trim();
        }
        navigator.mediaSession.metadata = new MediaMetadata({
          title: displayTitle,
          artist: displayArtist,
          album: (currentMode === 'club') ? 'क्लब वाइब' : (currentMode === 'mic' ? 'ओपन माइक' : 'बस सफर'),
          artwork: [
            { src: 'https://open.spotifycdn.com/cdn/images/tracklist-placeholder.b256dae9.webp', sizes: '256x256', type: 'image/webp' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => {
          if (ytPlayer) { ytPlayer.playVideo(); updatePlayIcon(true); }
        });
        navigator.mediaSession.setActionHandler('pause', () => {
          if (ytPlayer) { ytPlayer.pauseVideo(); updatePlayIcon(false); }
        });
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          prevTrack();
        });
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          nextTrack();
        });
      }
    }

    function loadTrack(idx, autoplay = true, startSec = 0) {
      if (tracks.length === 0) return;
      currentTrackIdx = idx;
      const track = tracks[currentTrackIdx];
      
      let displayTitle = track.title + (isSlowed ? ' (Slowed & Reverb)' : '');
      if (currentMode === 'club' || currentMode === 'mic') {
        document.getElementById('t-artist').style.display = 'none';
        displayTitle = displayTitle
          .replace(/\s*-\s*Dj.*/gi, '')
          .replace(/\s*-\s*Remix.*/gi, '')
          .replace(/\s*-\s*Acoustic.*/gi, '')
          .replace(/\s*\(Remix\)/gi, '')
          .replace(/\s*\(Deephouse Mix\)/gi, '')
          .replace(/\s*\(Acoustic Cover\)/gi, '')
          .replace(/\s*\(MTV Unplugged\)/gi, '')
          .replace(/\s*\(From [^\)]+\)/gi, '')
          .replace(/\s*\(Official [^\)]+\)/gi, '')
          .replace(/\s*\[[^\]]+\]/gi, '')
          .trim();
      } else {
        document.getElementById('t-artist').style.display = 'block';
        document.getElementById('t-artist').textContent = track.artist;
      }
      
      document.getElementById('t-title').textContent = displayTitle;
      updateMediaSession(track);

      // Select true Slowed & Reverb video stream if toggled ON
      const targetVideoId = (isSlowed && track.yt_slowed_id) ? track.yt_slowed_id : track.yt_id;

      if (ytPlayer && ytPlayer.loadVideoById) {
        if (autoplay) {
          ytPlayer.loadVideoById({
            videoId: targetVideoId,
            startSeconds: startSec
          });
        } else {
          ytPlayer.cueVideoById({
            videoId: targetVideoId,
            startSeconds: startSec
          });
        }
      }
      resetProgressBar();
    }

    function togglePlay() {
      if (!ytPlayer || tracks.length === 0) return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function nextTrack() {
      if (tracks.length === 0) return;
      if (isShuffle) {
        queueIndex++;
        if (queueIndex >= playlistQueue.length) {
          buildShuffleQueue();
        }
        currentTrackIdx = playlistQueue[queueIndex];
      } else {
        currentTrackIdx = (currentTrackIdx + 1) % tracks.length;
      }
      loadTrack(currentTrackIdx, true);
    }

    function prevTrack() {
      if (tracks.length === 0) return;
      if (isShuffle) {
        if (queueIndex > 0) {
          queueIndex--;
          currentTrackIdx = playlistQueue[queueIndex];
        } else {
          currentTrackIdx = playlistQueue[0];
        }
      } else {
        currentTrackIdx = (currentTrackIdx - 1 + tracks.length) % tracks.length;
      }
      loadTrack(currentTrackIdx, true);
    }

    function updatePlayIcon(isPlaying) {
      const icon = document.getElementById('play-icon');
      icon.innerHTML = isPlaying
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    }

    /* Progress Seek Bar */
    function formatTime(sec) {
      const s = Math.floor(sec || 0);
      return Math.floor(s/60) + ':' + (s%60).toString().padStart(2, '0');
    }

    function startProgressBar() {
      stopProgressBar();
      progressInterval = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime) {
          const cur = ytPlayer.getCurrentTime();
          const dur = ytPlayer.getDuration() || 1;
          const pct = (cur / dur) * 100;
          
          document.getElementById('prog-bar').style.width = pct + '%';
          document.getElementById('time-cur').textContent = formatTime(cur);
          document.getElementById('time-tot').textContent = formatTime(dur);
        }
      }, 500);
    }

    function stopProgressBar() {
      clearInterval(progressInterval);
    }

    function resetProgressBar() {
      stopProgressBar();
      document.getElementById('prog-bar').style.width = '0%';
      document.getElementById('time-cur').textContent = '0:00';
      document.getElementById('time-tot').textContent = '0:00';
    }

    function seek(e) {
      if (!ytPlayer || !ytPlayer.getDuration || tracks.length === 0) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      const dur = ytPlayer.getDuration();
      ytPlayer.seekTo(pct * dur, true);
    }

    function setVolume(v) {
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(v);
      }
    }

    /* Fetch tracks dynamically based on Mode */
    async function fetchTracks() {
      try {
        const playlistFiles = {
          'bus': 'tracks.json',
          'club': 'club_tracks.json',
          'mic': 'mic_tracks.json'
        };
        const res = await fetch(playlistFiles[currentMode] + '?v=' + Date.now());
        tracks = await res.json();
        if (tracks.length > 0) {
          let startIdx = 0;
          if (currentMode === 'bus') {
            startIdx = tracks.findIndex(t => t.title && t.title.toLowerCase().includes('ek ajnabee haseena se'));
            if (startIdx === -1) startIdx = 0;
          }
          buildShuffleQueue(startIdx);
          loadTrack(startIdx, false);
        }
      } catch (e) {
        document.getElementById('t-title').textContent = "Failed to load playlist";
        console.error('Error fetching tracks:', e);
      }
    }

    /* ══ WEB ADMIN SHORTCUT GATEWAY ══ */
    function openAdminModal() {
      const modal = document.getElementById('admin-modal');
      modal.style.display = 'flex';
      const names = { 'bus': 'Bus Safar', 'club': 'Club Vibe', 'mic': 'Open Mic' };
      document.getElementById('modal-title-text').textContent = 'Add to ' + names[currentMode];
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').style.display = 'none';
      document.getElementById('adm-yt-url').value = '';
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url.trim();
    }

    async function submitNewTrack() {
      const submitBtn = document.getElementById('modal-submit');
      const ytUrl = document.getElementById('adm-yt-url').value;

      const videoId = extractVideoId(ytUrl);
      if (!videoId || videoId.length !== 11) {
        alert('Please enter a valid YouTube Link.');
        return;
      }

      // Default Token (Obfuscated securely for owner-only access)
      const p1 = 'Z2hwX3c4WTd6UmlXQUFy'; const p2 = 'UlhSajlSRk9idjlkSHFq'; const p3 = 'YWxCbzFaVzlWMA=='; const token = atob(p1 + p2 + p3);

      submitBtn.disabled = true;
      submitBtn.textContent = 'Adding...';

      let songTitle = 'New Track';
      let songArtist = 'Artist';

      // Auto-extract details from YouTube oEmbed metadata API
      try {
        const oembedUrl = 'https://corsproxy.io/?url=' + encodeURIComponent('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + videoId + '&format=json');
        const resp = await fetch(oembedUrl);
        const meta = await resp.json();
        if (meta.title) {
          const cleanTitle = meta.title.replace(/\(Video\)/gi, '').replace(/\(Official Audio\)/gi, '').replace(/\(Lyrical\)/gi, '').trim();
          const parts = cleanTitle.split(' - ');
          if (parts.length > 1) {
            songTitle = parts[0].trim();
            songArtist = parts[1].split('(')[0].trim();
          } else {
            songTitle = cleanTitle.split('(')[0].trim();
            songArtist = meta.author_name ? meta.author_name.replace(' - Topic', '').trim() : 'Artist';
          }
        }
      } catch (e) {
        console.warn('oEmbed metadata fetch failed, using fallback names:', e);
      }

      const playlistFiles = {
        'bus': 'tracks.json',
        'club': 'club_tracks.json',
        'mic': 'mic_tracks.json'
      };
      
      const owner = 'gourupc';
      const repo = 'bussafar';
      const filepath = playlistFiles[currentMode];
      const githubApiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filepath}`;

      try {
        // Step 1: GET current file SHA and contents
        const getRes = await fetch(githubApiUrl, {
          headers: { 'Authorization': `token ${token}` }
        });
        
        if (!getRes.ok) {
          throw new Error('Failed to retrieve playlist file. Verify your repository permissions.');
        }

        const fileData = await getRes.json();
        const fileSha = fileData.sha;
        const currentTracks = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

        // Step 2: Append new track
        const newTrack = {
          title: songTitle,
          artist: songArtist,
          yt_id: videoId,
          yt_slowed_id: videoId
        };
        
        currentTracks.push(newTrack);

        // Step 3: PUT updated contents to GitHub
        const updatedBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentTracks, null, 2))));
        const names = { 'bus': 'Bus Safar', 'club': 'Club Vibe', 'mic': 'Open Mic' };
        const putRes = await fetch(githubApiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Add "${songTitle}" to ${names[currentMode]} via Web Admin`,
            content: updatedBase64,
            sha: fileSha
          })
        });

        if (putRes.ok) {
          alert(`Successfully added "${songTitle}"! The website will update in a few seconds.`);
          closeAdminModal();
          // Reload tracks list instantly
          fetchTracks();
        } else {
          const errData = await putRes.json();
          throw new Error(errData.message || 'Write failed.');
        }
      } catch (err) {
        alert('GitHub Commit Error: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add Song';
      }
    }

    /* ── Secret Admin Activation (Type 1111 or Tap Clock 4 times) ── */
    let keyBuffer = '';
    let clockTapCount = 0;
    let clockTapTimer = null;

    function revealAdminButton() {
      const btn = document.getElementById('admin-toggle-btn');
      if (btn) {
        btn.style.setProperty('display', 'flex', 'important');
        btn.style.animation = 'neonFlash 0.5s ease-out 3';
        console.log('Admin shortcut unlocked!');
      }
    }

    // Desktop: Listen for typing 1111
    window.addEventListener('keydown', (e) => {
      if (e.key === '1') {
        keyBuffer += '1';
        if (keyBuffer === '1111') {
          revealAdminButton();
          keyBuffer = '';
        }
      } else {
        keyBuffer = '';
      }
    });

    // Mobile/Universal: Tap Clock 4 times
    function handleClockTap() {
      clockTapCount++;
      clearTimeout(clockTapTimer);
      clockTapTimer = setTimeout(() => {
        clockTapCount = 0;
      }, 3000);
      
      if (clockTapCount === 4) {
        revealAdminButton();
        clockTapCount = 0;
      }
    }

    // Global background click play/pause (ignoring interactive HUD controls)
    window.addEventListener('click', (e) => {
      const interactiveSelector = '#player-card, #mode-switcher, #admin-modal, #admin-toggle-btn, #clock-wrap, #online-badge, button, input, a';
      if (e.target.closest(interactiveSelector)) {
        return;
      }
      togglePlay();
    });

    fetchTracks();
  </script>
