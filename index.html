<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>बस सफर</title>
  <meta name="description" content="बस सफर — एक सफर जो दिल को छू जाए। Music, motion & memories." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --glass-bg: rgba(10, 10, 20, 0.60);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --muted: rgba(241, 245, 249, 0.60);
    }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Inter',sans-serif; }

    /* VIDEO BACKGROUND */
    #bg-video {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:0;
      filter:brightness(0.70) saturate(1.15);
    }

    /* OVERLAYS */
    .overlay-top {
      position:fixed; top:0; left:0; right:0; height:24%;
      background:linear-gradient(to bottom,rgba(0,0,0,0.75) 0%,transparent 100%);
      z-index:1; pointer-events:none;
    }
    .overlay-bottom {
      position:fixed; bottom:0; left:0; right:0; height:40%;
      background:linear-gradient(to top,rgba(0,0,0,0.90) 0%,transparent 100%);
      z-index:1; pointer-events:none;
    }

    /* GLOWS */
    .glow { position:fixed; border-radius:50%; filter:blur(90px); opacity:.18; z-index:1; pointer-events:none; animation:floatGlow 9s ease-in-out infinite alternate; }
    .glow-orange { width:520px; height:520px; background:radial-gradient(circle,#f97316 0%,transparent 70%); bottom:-80px; left:-60px; }
    .glow-indigo  { width:420px; height:420px; background:radial-gradient(circle,#818cf8 0%,transparent 70%); top:-60px; right:-40px; animation-duration:11s; animation-direction:alternate-reverse; }
    @keyframes floatGlow { from{transform:translate(0,0) scale(1);} to{transform:translate(30px,20px) scale(1.08);} }

    /* HUD */
    #hud { position:fixed; inset:0; z-index:10; pointer-events:none; }
    #hud > * { pointer-events:auto; }

    /* Clock */
    #clock-wrap { position:absolute; top:22px; left:28px; display:flex; flex-direction:column; gap:2px; }
    #clock { font-size:15px; font-weight:500; color:var(--text); letter-spacing:.04em; text-shadow:0 1px 8px rgba(0,0,0,.7); }
    #date-display { font-size:11px; color:var(--muted); letter-spacing:.05em; text-shadow:0 1px 6px rgba(0,0,0,.6); }

    /* Online badge */
    #online-badge {
      position:absolute; top:22px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center; gap:7px;
      background:var(--glass-bg); border:1px solid var(--glass-border);
      border-radius:999px; padding:5px 14px;
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    }
    .pulse-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; animation:pulseDot 1.8s ease-out infinite; }
    @keyframes pulseDot { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.6);} 70%{box-shadow:0 0 0 7px rgba(34,197,94,0);} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0);} }
    #online-count { font-size:12px; color:var(--text); font-weight:500; letter-spacing:.04em; }

    /* Top-right Spotify link */
    #top-links { position:absolute; top:18px; right:24px; }
    .link-pill {
      display:flex; align-items:center; gap:5px;
      background:var(--glass-bg); border:1px solid var(--glass-border);
      border-radius:999px; padding:4px 10px;
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      text-decoration:none; color:var(--text); font-size:10px; font-weight:500;
      letter-spacing:.03em; transition:background .25s,transform .18s;
    }
    .link-pill:hover { background:rgba(255,255,255,.14); transform:translateY(-1px); }

    /* TITLE */
    #title-wrap {
      position:absolute; top:42%; left:50%; transform:translate(-50%,-50%);
      text-align:center; pointer-events:none;
      animation:titleIn 1.1s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes titleIn { from{opacity:0;transform:translate(-50%,-44%) scale(.92);} to{opacity:1;transform:translate(-50%,-50%) scale(1);} }
    #main-title {
      font-family:'Tiro Devanagari Hindi',serif;
      font-size:clamp(72px,12vw,160px); font-weight:400; color:#fff; line-height:1.05;
      text-shadow:0 2px 40px rgba(0,0,0,.9),0 0 80px rgba(249,115,22,.25);
      letter-spacing:-.01em;
    }

    /* DIRECT PLAYLIST PLAYER AT BOTTOM */
    #spotify-wrap {
      position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
      display:flex; flex-direction:column; align-items:center; gap:10px;
      width:360px;
    }
    #spotify-player {
      width:360px;
      height:152px;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 16px 56px rgba(0,0,0,0.80), 0 0 0 1px rgba(255,255,255,0.08);
      background:#121212;
    }
    #spotify-player iframe {
      display:block; border:none; border-radius:18px;
    }

    /* GRAIN */
    #grain {
      position:fixed; inset:0; z-index:2; opacity:.03; pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:200px; animation:grain .15s steps(1) infinite;
    }
    @keyframes grain { 0%{transform:translate(0,0);} 25%{transform:translate(-3px,2px);} 50%{transform:translate(2px,-3px);} 75%{transform:translate(-1px,3px);} 100%{transform:translate(3px,-1px);} }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="busdriver.mp4" type="video/mp4" />
  </video>

  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>
  <div class="glow glow-orange"></div>
  <div class="glow glow-indigo"></div>
  <div id="grain"></div>

  <div id="hud">

    <!-- Clock -->
    <div id="clock-wrap">
      <div id="clock">12:00 PM</div>
      <div id="date-display">Monday, 10 Aug 2026</div>
    </div>

    <!-- Online badge -->
    <div id="online-badge">
      <div class="pulse-dot"></div>
      <span id="online-count">41 online</span>
    </div>

    <!-- Spotify Link (Top Right) -->
    <div id="top-links">
      <a href="https://open.spotify.com/playlist/3jU4pDLZuYICElkyyRJwQi"
         target="_blank" rel="noopener" class="link-pill">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="#1ed760">
          <path d="M12 0C5.374 0 0 5.373 0 12c0 6.628 5.374 12 12 12 6.628 0 12-5.372 12-12 0-6.627-5.372-12-12-12zm5.51 17.34c-.214.33-.672.44-1.003.215-2.75-1.682-6.21-2.062-10.285-1.13-.394.09-.788-.156-.878-.551-.09-.394.156-.788.551-.878 4.459-1.017 8.283-.58 11.38 1.307.33.215.44.673.235 1.037zm1.47-3.27c-.27.413-.836.544-1.25.275-3.144-1.933-7.935-2.493-11.653-1.364-.473.142-.97-.13-1.112-.603-.141-.473.131-.97.604-1.112 4.248-1.29 9.518-.665 13.136 1.553.413.27.544.836.275 1.25zm.127-3.406c-3.769-2.237-9.986-2.443-13.586-1.352-.576.175-1.185-.15-1.36-.727-.174-.577.151-1.185.727-1.36 4.135-1.257 11.003-1.015 15.348 1.566.52.31.69.98.382 1.5-.31.52-.98.69-1.511.373z"/>
        </svg>
        Spotify ↗
      </a>
    </div>

    <!-- Hindi Title -->
    <div id="title-wrap">
      <h1 id="main-title">बस सफर</h1>
    </div>

    <!-- Direct Spotify Embed Player (Sandbox removed to fix Spotify "Something went wrong" script block) -->
    <div id="spotify-wrap">
      <div id="spotify-player">
        <iframe
          src="https://open.spotify.com/embed/playlist/3jU4pDLZuYICElkyyRJwQi?utm_source=generator&theme=0"
          width="360"
          height="152"
          frameborder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

  </div><!-- /hud -->

  <script>
    /* ── Clock ── */
    function updateClock() {
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hh = ((h%12)||12).toString().padStart(2,'0');
      const mm = m.toString().padStart(2,'0');
      document.getElementById('clock').textContent = hh+':'+mm+' '+ampm;
      const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('date-display').textContent =
        days[now.getDay()]+', '+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear();
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ── Online count ── */
    let baseCount = 38 + Math.floor(Math.random()*12);
    function updateCount() {
      baseCount += (Math.random()>.5?1:-1) * Math.floor(Math.random()*3);
      baseCount = Math.max(20, Math.min(baseCount, 85));
      document.getElementById('online-count').textContent = baseCount+' online';
    }
    setInterval(updateCount, 3200);
  </script>
</body>
</html>
