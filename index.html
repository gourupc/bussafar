<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>बस सफर</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --green:#1ed760;--green2:rgba(30,215,96,.18);
      --glass:rgba(8,8,20,.72);--border:rgba(255,255,255,.11);
      --text:#f1f5f9;--muted:rgba(241,245,249,.55);
    }
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Inter',sans-serif;}

    #bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.68) saturate(1.2);}
    .ov-top{position:fixed;top:0;left:0;right:0;height:26%;background:linear-gradient(to bottom,rgba(0,0,0,.80),transparent);z-index:1;pointer-events:none;}
    .ov-bot{position:fixed;bottom:0;left:0;right:0;height:46%;background:linear-gradient(to top,rgba(0,0,0,.94),transparent);z-index:1;pointer-events:none;}

    .glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.16;z-index:1;pointer-events:none;}
    .g1{width:500px;height:500px;background:radial-gradient(circle,#f97316,transparent 70%);bottom:-80px;left:-60px;animation:gl 9s ease-in-out infinite alternate;}
    .g2{width:400px;height:400px;background:radial-gradient(circle,#818cf8,transparent 70%);top:-60px;right:-40px;animation:gl 11s ease-in-out infinite alternate-reverse;}
    @keyframes gl{from{transform:translate(0,0) scale(1);}to{transform:translate(26px,16px) scale(1.09);}}

    #grain{position:fixed;inset:0;z-index:2;opacity:.03;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;animation:gr .12s steps(1) infinite;}
    @keyframes gr{0%{transform:translate(0,0);}33%{transform:translate(-2px,2px);}66%{transform:translate(2px,-2px);}100%{transform:translate(-1px,1px);}}

    /* HUD */
    #hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
    #hud>*{pointer-events:auto;}

    /* Clock */
    #clk{position:absolute;top:22px;left:28px;}
    #clk-t{font-size:15px;font-weight:500;color:var(--text);text-shadow:0 1px 8px rgba(0,0,0,.7);}
    #clk-d{font-size:11px;color:var(--muted);margin-top:2px;}

    /* Badge */
    #badge{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:5px 14px;backdrop-filter:blur(16px);}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pu 1.8s ease-out infinite;}
    @keyframes pu{0%{box-shadow:0 0 0 0 rgba(30,215,96,.6);}70%{box-shadow:0 0 0 7px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
    #badge-n{font-size:12px;color:var(--text);font-weight:500;}

    /* Top right */
    #tr{position:absolute;top:18px;right:24px;}
    .pill{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:5px 13px;text-decoration:none;color:var(--text);font-size:11px;font-weight:500;backdrop-filter:blur(14px);transition:background .2s,transform .18s;}
    .pill:hover{background:rgba(255,255,255,.15);transform:translateY(-1px);}

    /* Title */
    #title-wrap{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;animation:ti 1.1s cubic-bezier(.22,.61,.36,1) both;}
    @keyframes ti{from{opacity:0;transform:translate(-50%,-44%) scale(.92);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
    #title-wrap h1{font-family:'Tiro Devanagari Hindi',serif;font-size:clamp(68px,11vw,152px);font-weight:400;color:#fff;line-height:1.05;text-shadow:0 2px 40px rgba(0,0,0,.9),0 0 80px rgba(249,115,22,.28);}

    /* ══ LOGIN SCREEN ══ */
    #login-screen{
      position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
      display:flex;flex-direction:column;align-items:center;gap:10px;
    }
    #login-btn{
      display:flex;align-items:center;gap:10px;
      background:var(--green);border:none;border-radius:999px;
      padding:12px 28px;cursor:pointer;
      font-size:14px;font-weight:700;color:#000;letter-spacing:.04em;
      box-shadow:0 4px 24px rgba(30,215,96,.45);
      transition:transform .18s,background .2s,box-shadow .2s;
    }
    #login-btn:hover{background:#1fdf65;transform:translateY(-2px);box-shadow:0 8px 32px rgba(30,215,96,.55);}
    #login-hint{font-size:11px;color:var(--muted);text-align:center;line-height:1.5;}

    /* ══ STATUS / LOADING ══ */
    #status-msg{
      position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
      display:none;align-items:center;gap:8px;
      background:var(--glass);border:1px solid var(--border);border-radius:999px;
      padding:8px 20px;backdrop-filter:blur(14px);color:var(--text);font-size:12px;white-space:nowrap;
    }
    .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ══ MUSIC PLAYER ══ */
    #player{
      position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
      width:370px;
      background:rgba(8,8,20,.84);
      border:1px solid rgba(255,255,255,.12);
      border-radius:22px;
      backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
      padding:16px 18px 18px;
      box-shadow:0 24px 64px rgba(0,0,0,.80),0 0 0 1px rgba(255,255,255,.04);
      display:none;
      animation:slideUp .4s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(24px) scaleY(.9);}to{opacity:1;transform:translateX(-50%) translateY(0) scaleY(1);}}

    /* Track row */
    #track-row{display:flex;align-items:center;gap:13px;margin-bottom:12px;}
    #art{
      width:56px;height:56px;border-radius:11px;object-fit:cover;
      background:linear-gradient(135deg,#1a1a2e,#16213e);flex-shrink:0;
      box-shadow:0 6px 20px rgba(0,0,0,.5);transition:opacity .35s;
    }
    #track-info{flex:1;min-width:0;}
    #t-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
    #t-artist{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
    #t-album{font-size:10px;color:rgba(241,245,249,.32);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    /* Progress */
    #prog-wrap{margin-bottom:10px;}
    #prog-bg{width:100%;height:4px;background:rgba(255,255,255,.10);border-radius:999px;cursor:pointer;position:relative;overflow:hidden;}
    #prog-fill{height:100%;background:linear-gradient(90deg,var(--green),#1fdf65);border-radius:999px;width:0%;transition:width .9s linear;pointer-events:none;}
    #time-row{display:flex;justify-content:space-between;margin-top:5px;}
    #time-row span{font-size:10px;color:var(--muted);}

    /* Controls */
    #ctrls{display:flex;align-items:center;justify-content:center;gap:22px;}
    .cb{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:flex;align-items:center;transition:color .18s,transform .18s;}
    .cb:hover{color:var(--text);transform:scale(1.14);}
    #pb{
      width:46px;height:46px;border-radius:50%;
      background:var(--green);border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 18px rgba(30,215,96,.40);
      transition:background .18s,transform .18s,box-shadow .18s;
    }
    #pb:hover{background:#1fdf65;transform:scale(1.08);box-shadow:0 8px 28px rgba(30,215,96,.55);}
    #pb svg{color:#000;}

    /* Volume row */
    #vol-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
    #vol-row svg{color:var(--muted);flex-shrink:0;}
    #vol-slider{flex:1;-webkit-appearance:none;appearance:none;height:3px;background:rgba(255,255,255,.12);border-radius:999px;outline:none;cursor:pointer;}
    #vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--green);cursor:pointer;}
  </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline>
  <source src="busdriver.mp4" type="video/mp4"/>
</video>
<div class="ov-top"></div>
<div class="ov-bot"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div id="grain"></div>

<!-- Spotify Web Playback SDK -->
<script src="https://sdk.scdn.co/spotify-player.js"></script>

<div id="hud">

  <!-- Clock -->
  <div id="clk">
    <div id="clk-t">12:00 PM</div>
    <div id="clk-d">Monday, 10 Aug 2026</div>
  </div>

  <!-- Online badge -->
  <div id="badge">
    <div class="dot"></div>
    <span id="badge-n">41 online</span>
  </div>

  <!-- Spotify external link -->
  <div id="tr">
    <a href="https://open.spotify.com/playlist/3jU4pDLZuYICElkyyRJwQi" target="_blank" rel="noopener" class="pill">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#1ed760"><path d="M12 0C5.374 0 0 5.373 0 12c0 6.628 5.374 12 12 12 6.628 0 12-5.372 12-12 0-6.627-5.372-12-12-12zm5.51 17.34c-.214.33-.672.44-1.003.215-2.75-1.682-6.21-2.062-10.285-1.13-.394.09-.788-.156-.878-.551-.09-.394.156-.788.551-.878 4.459-1.017 8.283-.58 11.38 1.307.33.215.44.673.235 1.037zm1.47-3.27c-.27.413-.836.544-1.25.275-3.144-1.933-7.935-2.493-11.653-1.364-.473.142-.97-.13-1.112-.603-.141-.473.131-.97.604-1.112 4.248-1.29 9.518-.665 13.136 1.553.413.27.544.836.275 1.25zm.127-3.406c-3.769-2.237-9.986-2.443-13.586-1.352-.576.175-1.185-.15-1.36-.727-.174-.577.151-1.185.727-1.36 4.135-1.257 11.003-1.015 15.348 1.566.52.31.69.98.382 1.5-.31.52-.98.69-1.511.373z"/></svg>
      Spotify ↗
    </a>
  </div>

  <!-- Title -->
  <div id="title-wrap"><h1>बस सफर</h1></div>

  <!-- Status / Loading -->
  <div id="status-msg">
    <div class="spin"></div>
    <span id="status-text">Connecting…</span>
  </div>

  <!-- Login button (shown when not authenticated) -->
  <div id="login-screen">
    <button id="login-btn" onclick="loginSpotify()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 6.628 5.374 12 12 12 6.628 0 12-5.372 12-12 0-6.627-5.372-12-12-12zm5.51 17.34c-.214.33-.672.44-1.003.215-2.75-1.682-6.21-2.062-10.285-1.13-.394.09-.788-.156-.878-.551-.09-.394.156-.788.551-.878 4.459-1.017 8.283-.58 11.38 1.307.33.215.44.673.235 1.037zm1.47-3.27c-.27.413-.836.544-1.25.275-3.144-1.933-7.935-2.493-11.653-1.364-.473.142-.97-.13-1.112-.603-.141-.473.131-.97.604-1.112 4.248-1.29 9.518-.665 13.136 1.553.413.27.544.836.275 1.25zm.127-3.406c-3.769-2.237-9.986-2.443-13.586-1.352-.576.175-1.185-.15-1.36-.727-.174-.577.151-1.185.727-1.36 4.135-1.257 11.003-1.015 15.348 1.566.52.31.69.98.382 1.5-.31.52-.98.69-1.511.373z"/></svg>
      Spotify से Connect करें
    </button>
    <div id="login-hint">एक बार login करें — फिर music इसी screen पर चलेगा 🎵</div>
  </div>

  <!-- Music Player (shown after auth) -->
  <div id="player">
    <div id="track-row">
      <img id="art" src="" alt=""/>
      <div id="track-info">
        <div id="t-name">Loading…</div>
        <div id="t-artist">—</div>
        <div id="t-album"></div>
      </div>
    </div>

    <div id="prog-wrap">
      <div id="prog-bg" onclick="seekTo(event)">
        <div id="prog-fill"></div>
      </div>
      <div id="time-row">
        <span id="tc">0:00</span>
        <span id="tt">0:00</span>
      </div>
    </div>

    <div id="ctrls">
      <button class="cb" onclick="sp.previousTrack()" title="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="pb" onclick="sp.togglePlay()" title="Play/Pause">
        <svg id="picon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="cb" onclick="sp.nextTrack()" title="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 3.9V8.1L8.5 12zM16 6h2v12h-2z"/></svg>
      </button>
    </div>

    <div id="vol-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input id="vol-slider" type="range" min="0" max="100" value="80" oninput="setVol(this.value)"/>
    </div>
  </div>

</div><!-- /hud -->

<script>
/* ════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════ */
const CLIENT_ID    = '4264c2fcb8f343419a0888eb0c3d2ec9';
const REDIRECT_URI = 'http://localhost:8080';
const PLAYLIST_URI = 'spotify:playlist:3jU4pDLZuYICElkyyRJwQi';
const SCOPES       = [
  'streaming',
  'user-read-email',
  'user-read-private',
  'user-modify-playback-state',
  'user-read-playback-state',
  'playlist-read-private',
  'playlist-read-collaborative'
].join(' ');

/* ════════════════════════════════════════════
   CLOCK
═══════════════════════════════════════════════ */
function tick(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes();
  const ap=h>=12?'PM':'AM',hh=((h%12)||12).toString().padStart(2,'0'),mm=m.toString().padStart(2,'0');
  document.getElementById('clk-t').textContent=hh+':'+mm+' '+ap;
  const D=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clk-d').textContent=D[n.getDay()]+', '+n.getDate()+' '+M[n.getMonth()]+' '+n.getFullYear();
}
tick(); setInterval(tick,1000);

/* Online count */
let bc=38+Math.floor(Math.random()*12);
setInterval(()=>{bc+=(Math.random()>.5?1:-1)*Math.floor(Math.random()*3);bc=Math.max(20,Math.min(bc,85));document.getElementById('badge-n').textContent=bc+' online';},3200);

/* ════════════════════════════════════════════
   PKCE HELPERS
═══════════════════════════════════════════════ */
function rndStr(n){
  const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',a=crypto.getRandomValues(new Uint8Array(n));
  return Array.from(a,v=>c[v%c.length]).join('');
}
async function sha256(s){
  const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

/* ════════════════════════════════════════════
   UI HELPERS
═══════════════════════════════════════════════ */
function showStatus(msg){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('player').style.display='none';
  const s=document.getElementById('status-msg');
  s.style.display='flex';
  document.getElementById('status-text').textContent=msg;
}
function showLogin(){
  document.getElementById('status-msg').style.display='none';
  document.getElementById('player').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}
function showPlayer(){
  document.getElementById('status-msg').style.display='none';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('player').style.display='block';
}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');}

/* ════════════════════════════════════════════
   OAUTH — LOGIN
═══════════════════════════════════════════════ */
async function loginSpotify(){
  const verifier=rndStr(128);
  const challenge=await sha256(verifier);
  localStorage.setItem('pkce_v',verifier);
  const p=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',
    redirect_uri:REDIRECT_URI,scope:SCOPES,
    code_challenge_method:'S256',code_challenge:challenge});
  window.location='https://accounts.spotify.com/authorize?'+p;
}

/* ════════════════════════════════════════════
   OAUTH — HANDLE CALLBACK
═══════════════════════════════════════════════ */
async function handleCallback(code){
  showStatus('Authenticating…');
  const verifier=localStorage.getItem('pkce_v');
  const r=await fetch('https://accounts.spotify.com/api/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',
      code,redirect_uri:REDIRECT_URI,code_verifier:verifier})
  });
  const d=await r.json();
  if(d.access_token){
    localStorage.setItem('sp_token',d.access_token);
    localStorage.setItem('sp_refresh',d.refresh_token||'');
    localStorage.setItem('sp_exp',Date.now()+(d.expires_in||3600)*1000);
    window.history.replaceState({},'','/');
    return d.access_token;
  }
  console.error('Token error',d);
  return null;
}

/* Refresh token */
async function refreshToken(){
  const rt=localStorage.getItem('sp_refresh');
  if(!rt) return null;
  const r=await fetch('https://accounts.spotify.com/api/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'refresh_token',refresh_token:rt})
  });
  const d=await r.json();
  if(d.access_token){
    localStorage.setItem('sp_token',d.access_token);
    localStorage.setItem('sp_exp',Date.now()+(d.expires_in||3600)*1000);
    return d.access_token;
  }
  return null;
}

async function getToken(){
  const exp=parseInt(localStorage.getItem('sp_exp')||'0');
  if(Date.now()<exp-60000) return localStorage.getItem('sp_token');
  return await refreshToken();
}

/* ════════════════════════════════════════════
   SPOTIFY WEB PLAYBACK SDK
═══════════════════════════════════════════════ */
let sp=null, deviceId=null;

function initSDK(token){
  showStatus('Starting player…');
  sp=new Spotify.Player({
    name:'बस सफर 🎵',
    getOAuthToken:async cb=>cb(await getToken()),
    volume:0.8
  });

  sp.addListener('ready',({device_id})=>{
    deviceId=device_id;
    startPlaylist(token);
  });

  sp.addListener('not_ready',()=>showStatus('Player disconnected…'));

  sp.addListener('initialization_error',({message})=>{
    showStatus('Init error: '+message);
  });

  sp.addListener('authentication_error',()=>{
    localStorage.removeItem('sp_token');
    showLogin();
  });

  sp.addListener('account_error',()=>{
    showStatus('⚠ Spotify Premium required for in-browser playback');
    setTimeout(showLogin,3000);
  });

  sp.addListener('player_state_changed',updatePlayerUI);

  sp.connect();

  /* Poll progress every second */
  setInterval(async()=>{
    if(!sp) return;
    const s=await sp.getCurrentState();
    if(!s||s.paused) return;
    const pct=(s.position/s.duration)*100;
    document.getElementById('prog-fill').style.width=pct+'%';
    document.getElementById('tc').textContent=fmt(s.position);
  },1000);
}

async function startPlaylist(token){
  showStatus('Loading playlist…');
  try{
    /* Transfer playback to this browser device */
    await fetch('https://api.spotify.com/v1/me/player',{
      method:'PUT',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({device_ids:[deviceId],play:false})
    });
    await new Promise(r=>setTimeout(r,600));

    /* PUT /v1/me/player/play — play your playlist! */
    const res=await fetch('https://api.spotify.com/v1/me/player/play',{
      method:'PUT',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({
        context_uri:PLAYLIST_URI,
        offset:{position:0},
        position_ms:0
      })
    });
    if(res.status===204||res.status===200){
      showPlayer();
    } else {
      const err=await res.json().catch(()=>({}));
      showStatus('⚠ '+(err?.error?.message||'Could not start playback'));
    }
  }catch(e){
    showStatus('Network error: '+e.message);
  }
}

function updatePlayerUI(state){
  if(!state) return;
  const t=state.track_window.current_track;
  document.getElementById('t-name').textContent=t.name;
  document.getElementById('t-artist').textContent=t.artists.map(a=>a.name).join(', ');
  document.getElementById('t-album').textContent=t.album.name;
  const img=t.album.images[0]?.url||'';
  document.getElementById('art').src=img;
  document.getElementById('tt').textContent=fmt(state.duration);
  const picon=document.getElementById('picon');
  picon.innerHTML=state.paused
    ?'<path d="M8 5v14l11-7z"/>'           /* play */
    :'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; /* pause */
  showPlayer();
}

/* Seek */
function seekTo(e){
  if(!sp) return;
  const r=e.currentTarget.getBoundingClientRect();
  const pct=(e.clientX-r.left)/r.width;
  sp.getCurrentState().then(s=>{ if(s) sp.seek(pct*s.duration); });
}

/* Volume */
function setVol(v){ if(sp) sp.setVolume(v/100); }

/* ════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
window.onSpotifyWebPlaybackSDKReady=()=>{
  /* SDK is ready — check if we have a token */
  const token=localStorage.getItem('sp_token');
  const exp=parseInt(localStorage.getItem('sp_exp')||'0');
  if(token && Date.now()<exp){
    initSDK(token);
  }
  /* else: login screen is already showing */
};

async function init(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  const error=params.get('error');

  if(error){
    showStatus('Spotify login cancelled. Retry करें।');
    setTimeout(showLogin,2500);
    return;
  }

  if(code){
    const token=await handleCallback(code);
    if(token){
      /* SDK might already be ready, or wait for it */
      if(window.Spotify && window.Spotify.Player){
        initSDK(token);
      }
      /* else onSpotifyWebPlaybackSDKReady will fire and pick up the token */
      return;
    }
    showLogin();
    return;
  }

  /* Check existing token */
  const token=localStorage.getItem('sp_token');
  const exp=parseInt(localStorage.getItem('sp_exp')||'0');
  if(token && Date.now()<exp){
    showStatus('Reconnecting…');
    return; /* SDK ready callback will handle it */
  }

  /* Try refresh */
  const rt=localStorage.getItem('sp_refresh');
  if(rt){
    showStatus('Refreshing session…');
    const newToken=await refreshToken();
    if(newToken){ showStatus('Connecting…'); return; }
  }

  showLogin();
}

init();
</script>
